# Linux/CUDA replica of the authors' "repeng" environment, the one that produced
# the paper's results (Windows, mambaforge, Python 3.11, RTX 4090).
#
# The versions are the ones that ACTUALLY LOAD in that environment. Several
# packages there were installed by both conda and pip; where two copies exist,
# the version on disk was checked (see repeng-inventory.txt). Packages used only
# for unrelated work (R bridge, llama.cpp, wandb, TransformerLens, Qt, pywin32)
# are left out.
#
# PINNED EXACTLY, because the repe pipelines import transformers internals that
# change between versions:  torch 2.7.1 (CUDA 12.6), transformers 4.52.4,
# tokenizers 0.21.4, accelerate 1.9.0.
#
#   conda env create -f examples/act_three/scale70b/environment.yml   # or: mamba env create ...
#   conda activate repeng
#   pip install -e .          # from the repository root: installs the repo's own 'repe'
#
# Do NOT `pip install repe` from PyPI or GitHub: the experiments use the repo's
# repe/ folder (a fork of andyzoujm/representation-engineering, commit 5455d8a,
# plus utils.py and wrappers.py).
name: repeng
channels:
  - conda-forge
dependencies:
  - python=3.11.13
  - pip=25.1.1
  - numpy=1.26.4
  - pandas=2.3.0
  - scipy=1.16.0
  - scikit-learn=1.7.0
  - statsmodels=0.14.5
  - matplotlib=3.10.5
  - seaborn=0.13.2
  - tqdm=4.67.1
  - pyyaml=6.0.2
  - pyarrow=19.0.1
  - regex=2024.11.6
  - safetensors=0.5.3
  - jinja2=3.1.6
  - psutil=7.0.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1
      - transformers==4.52.4
      - tokenizers==0.21.4
      - accelerate==1.9.0
      - huggingface-hub==0.33.1
      - hf-xet==1.1.5
      - sentencepiece==0.2.0
      - datasets==4.0.0
      - vaderSentiment==3.3.2
      - krippendorff==0.9.0
      # Optional, only for ACT70B_QUANT=8bit/4bit (not in the authors' environment):
      # - bitsandbytes
